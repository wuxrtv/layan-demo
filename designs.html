<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LAYAN — варианты дизайна</title>
  <link rel="icon" href="assets/logo-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f6efe2; --text: #2a2218; --hint: #8f8068; --gold: #b8892b; --gold-bg: linear-gradient(135deg, #dcb75e 0%, #b8892b 55%, #966b1b 100%); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Montserrat', -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    header { position: relative; max-width: 1240px; margin: 0 auto; padding: 36px 16px 8px; text-align: center; }
    .logo { width: 170px; height: auto; }
    h1 { margin: 18px 0 6px; font: 600 clamp(30px, 5vw, 46px)/1.05 'Cormorant Garamond', Georgia, serif; }
    .sub { max-width: 620px; margin: 0 auto; color: var(--hint); }
    .lang { position: absolute; top: 18px; right: 16px; display: flex; padding: 3px; border-radius: 999px; background: rgba(176, 137, 62, .14); }
    .lang button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font: 600 13px 'Montserrat', sans-serif; color: var(--hint); cursor: pointer; }
    .lang button.on { background: #fff; color: var(--gold); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

    .options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; max-width: 1240px; margin: 0 auto; padding: 32px 16px 24px; }
    .opt { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .num { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--gold-bg); color: #fff; font: 600 15px 'Montserrat', sans-serif; }
    .opt h2 { margin: 8px 0 2px; font: 600 30px/1.1 'Cormorant Garamond', Georgia, serif; }
    .opt p { min-height: 4.5em; max-width: 340px; margin: 0 0 18px; color: var(--hint); font-size: 14px; }

    /* рамка телефона: экран 375×780, масштабируется под ширину колонки */
    .phone-box { width: 100%; max-width: 395px; min-height: 0; aspect-ratio: 395 / 800; }
    .phone-box > .phone { position: relative; }
    .phone-box { position: relative; overflow: visible; contain: size; }
    .phone { width: 395px; height: 800px; padding: 10px; border-radius: 52px; background: #15130f; box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 24px 60px rgba(60, 40, 10, .25); transform-origin: 0 0; }
    .phone iframe { display: block; width: 375px; height: 780px; border: 0; border-radius: 42px; background: #fff; }
    .open { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 999px; background: var(--gold-bg); color: #fff; font-weight: 600; text-decoration: none; box-shadow: 0 6px 18px rgba(184, 137, 43, .35); }
    .note { max-width: 640px; margin: 8px auto 48px; padding: 0 16px; text-align: center; font-size: 13px; color: var(--hint); }

    @media (max-width: 900px) {
      .options { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: min(86vw, 380px); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; }
      .opt { scroll-snap-align: center; }
      .opt p { min-height: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="lang"><button data-l="ru">RU</button><button data-l="uz">UZ</button></div>
    <img class="logo" src="assets/logo-full.webp" alt="LAYAN">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
  </header>

  <main class="options">
    <section class="opt" data-d="classic">
      <div class="num">1</div>
      <h2 data-t="classic"></h2>
      <p data-t="classicText"></p>
      <div class="phone-box"><div class="phone"><iframe title="Classic" loading="lazy"></iframe></div></div>
      <a class="open" target="_blank" rel="noopener" data-t="open"></a>
    </section>
    <section class="opt" data-d="night">
      <div class="num">2</div>
      <h2 data-t="night"></h2>
      <p data-t="nightText"></p>
      <div class="phone-box"><div class="phone"><iframe title="Premium" loading="lazy"></iframe></div></div>
      <a class="open" target="_blank" rel="noopener" data-t="open"></a>
    </section>
    <section class="opt" data-d="tg">
      <div class="num">3</div>
      <h2 data-t="tg"></h2>
      <p data-t="tgText"></p>
      <div class="phone-box"><div class="phone"><iframe title="Telegram" loading="lazy"></iframe></div></div>
      <a class="open" target="_blank" rel="noopener" data-t="open"></a>
    </section>
  </main>

  <p class="note" data-t="note"></p>

  <script>
    const T = {
      ru: {
        title: 'Варианты дизайна мини-приложения',
        sub: 'Telegram Mini App для LAYAN. Выберите вариант, который ближе. Каждый можно полистать прямо здесь, как настоящий магазин.',
        classic: 'Классика',
        classicText: 'Светлый кремовый фон и золото, как на логотипе. Элегантно и по-семейному тепло.',
        night: 'Премиум',
        nightText: 'Тёмный фон и золотое свечение. Ощущение дорогого бутика.',
        tg: 'Telegram',
        tgText: 'Родной стиль Telegram с золотым акцентом бренда. Сам подстраивается под светлую или тёмную тему пользователя.',
        open: 'Открыть вариант',
        note: 'Демо-версия: фото товаров временные, заказы не отправляются.',
      },
      uz: {
        title: 'Mini ilova dizayni variantlari',
        sub: "LAYAN uchun Telegram Mini App. O'zingizga yoqqan variantni tanlang. Har birini shu yerning o'zida haqiqiy do'kon kabi ko'rib chiqish mumkin.",
        classic: 'Klassika',
        classicText: 'Logotipdagidek och krem fon va oltin rang. Nafis va oilaviy iliq.',
        night: 'Premium',
        nightText: "To'q fon va oltin jilo. Qimmatbaho butik hissi.",
        tg: 'Telegram',
        tgText: "Brendning oltin urg'usi bilan Telegramning o'z uslubi. Foydalanuvchining yorug' yoki qorong'i mavzusiga o'zi moslashadi.",
        open: 'Variantni ochish',
        note: "Demo versiya: mahsulot rasmlari vaqtinchalik, buyurtmalar yuborilmaydi.",
      },
    };

    const store = {
      get() { try { return JSON.parse(localStorage.getItem('shop:lang')) || 'ru'; } catch (e) { return 'ru'; } },
      set(v) { try { localStorage.setItem('shop:lang', JSON.stringify(v)); } catch (e) { /* приватный режим */ } },
    };

    function apply(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
      document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
      document.querySelectorAll('.opt').forEach((opt) => {
        const url = 'index.html?d=' + opt.dataset.d;
        opt.querySelector('.open').href = url;
        opt.querySelector('iframe').src = url + '&l=' + lang; // параметр l меняет адрес, чтобы фрейм перезагрузился на новом языке
      });
    }

    document.querySelector('.lang').addEventListener('click', (e) => {
      const l = e.target.dataset.l;
      if (!l) return;
      store.set(l);
      apply(l);
    });

    function fit() {
      document.querySelectorAll('.phone-box').forEach((box) => {
        box.firstElementChild.style.transform = `scale(${box.clientWidth / 395})`;
      });
    }
    window.addEventListener('resize', fit);

    apply(store.get());
    fit();
  </script>
</body>
</html>
