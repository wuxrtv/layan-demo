# Cloudflare Pages: магазин (public/) + API (functions/) + база D1.
# Секреты TG_BOT_TOKEN и TG_CHAT_ID задаются в панели Cloudflare (Settings → Variables and Secrets), не здесь.
name = "layan-shop"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "layan"
database_id = "00000000-0000-0000-0000-000000000000" # заменить на ID базы из Cloudflare

[vars]
# Вход в админку — Cloudflare Access (Zero Trust). Заполняется после настройки Access.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Почты, которым разрешён вход (через запятую)
ADMIN_EMAILS = "layanliveee@gmail.com"
