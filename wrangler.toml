# Cloudflare Pages: магазин (public/) + API (functions/) + база D1.
#
# Секреты задаются в панели Cloudflare (Workers & Pages → layan-shop → Settings → Variables and Secrets),
# в этом файле их нет:
#   TG_BOT_TOKEN  — токен бота от @BotFather (вход в админку и уведомления о заказах)
#   ADMIN_TG_IDS  — Telegram ID администраторов через запятую (ID видно в админке при первом входе)
#   TG_CHAT_ID    — необязательно: ID группы менеджеров; если не задан, заказы приходят администраторам в личку
name = "layan-shop"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "layan"
database_id = "4f4ee2c6-7aaa-464b-b123-b8c3d332567b"
